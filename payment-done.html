<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment received</title>
  <meta name="theme-color" content="#0B0B1A">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0B0B1A; color: #fff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 16px; box-sizing: border-box; text-align: center;
    }
    .card { max-width: 380px; border: 2px solid #FFD700; border-radius: 18px; padding: 28px 22px; background: #15152A; }
    h1 { color: #FFD700; font-size: 24px; margin: 8px 0 10px; }
    p { color: rgba(255,255,255,0.75); line-height: 1.5; margin: 0 0 18px; }
    a {
      display: inline-block; background: linear-gradient(135deg, #FFB81C, #FFA500); color: #1A1000;
      font-weight: 800; text-decoration: none; border-radius: 26px; padding: 12px 26px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:48px">🛺</div>
    <h1>Thanks — payment received!</h1>
    <p>Go back to Monkey Keke Dash. Your coins are added as soon as the payment is confirmed — usually within a minute.</p>
    <a id="back" href="./">BACK TO THE GAME</a>
  </div>
  <script>
    // Opened as a new tab from the game: just close it (the game tab is watching).
    // Opened in the same tab (pop-ups blocked): go back to the game, which
    // confirms the saved payment on start-up.
    if (window.opener) {
      setTimeout(function () { try { window.close(); } catch (e) {} }, 2500);
      document.getElementById('back').addEventListener('click', function (e) {
        e.preventDefault();
        try { window.close(); } catch (err) { location.href = './'; }
      });
    } else {
      setTimeout(function () { location.replace('./'); }, 4000);
    }
  </script>
</body>
</html>
